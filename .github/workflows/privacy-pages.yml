name: Verify published artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Earlier release (public-safe/)
        run: python scripts/verify_safe.py
      - name: Decision desk (review-092b/) — rebuild, then verify
        run: |
          python review-092b/_src/build.py
          python review-092b/_src/verify.py
      - name: Decision desk regression tests
        run: python -m unittest discover -s review-092b/_src -p "test_*.py" -v
      - name: Consolidated decision site (decision/) \u2014 rebuild, then verify
        run: |
          python decision/_src/build.py
          python decision/_src/verify.py
      - name: Consolidated decision site \u2014 model regression tests
        run: python -m unittest discover -s decision/_src -p "test_*.py" -v
      - name: Landing page links resolve
        run: python scripts/check_landing.py
