name: Verify published artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 2026-11-15: this pipeline used to rebuild and verify eighteen separate desks, sixteen of
      # which served household figures and city names. It now verifies the one published desk and
      # the published surface gate, which scans every published directory rather than one curated
      # one. A withdrawn desk is still in the repository as working material; it is not rebuilt
      # here because it is not served.
      - name: Published surface (fail-closed publication set, all published directories)
        run: python scripts/verify_safe.py

      - name: Operating desk — rebuild model, pages and privacy register
        run: |
          python desk-ops/_src/model.py
          python desk-ops/_src/build.py
          python desk-ops/privacy/build.py

      - name: Operating desk — generated pages are current
        run: |
          if ! git diff --quiet -- desk-ops; then
            echo "::error::desk-ops/ is stale. Re-run the model and the builders and commit the result."
            git --no-pager diff --stat -- desk-ops
            exit 1
          fi

      - name: Operating desk — model is deterministic
        run: |
          cp desk-ops/_src/model.json .det-a.json
          python desk-ops/_src/model.py
          diff -q .det-a.json desk-ops/_src/model.json && rm -f .det-a.json

      - name: Operating desk — publication contract
        run: python desk-ops/_src/verify.py

      - name: Operating desk — regression and base-dependence tests
        run: python -m unittest discover -s desk-ops/_src -p "test_*.py" -v

      - name: Landing page links resolve
        run: python scripts/check_landing.py

      - name: Privacy scan (repository-wide, reports only)
        run: python scripts/privacy_scan.py --summary || true
