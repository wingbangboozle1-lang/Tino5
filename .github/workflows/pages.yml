name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify static site files, table sources, and internal links
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys
          from urllib.parse import urlparse

          root = Path('.')
          pages = [root / 'index.html', *sorted((root / 'pages').glob('*.html'))]
          errors = []

          class SiteParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
                  self.rows = []
                  self.in_row = False
                  self.in_cell = False
                  self.cell_links = []
                  self.row_cells = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'a':
                      href = attrs.get('href', '')
                      if href:
                          self.hrefs.append(href)
                          if self.in_cell:
                              self.cell_links.append(href)
                  elif tag == 'tr':
                      self.in_row = True
                      self.row_cells = []
                  elif tag in ('td', 'th') and self.in_row:
                      self.in_cell = True
                      self.cell_links = []
              def handle_endtag(self, tag):
                  if tag in ('td', 'th') and self.in_cell:
                      self.row_cells.append(self.cell_links)
                      self.in_cell = False
                  elif tag == 'tr' and self.in_row:
                      if self.row_cells and any(self.row_cells):
                          self.rows.append(self.row_cells)
                      self.in_row = False

          for page in pages:
              parser = SiteParser()
              source = page.read_text(encoding='utf-8')
              parser.feed(source)
              if '<!doctype html>' not in source.lower():
                  errors.append(f'{page}: missing doctype')
              for row_num, cells in enumerate(parser.rows, 1):
                  data_cells = [links for links in cells if links]
                  source_links = [href for links in data_cells for href in links
                                  if href.startswith('https://')]
                  if not source_links:
                      errors.append(f'{page}: table row {row_num} has no HTTPS source link')
                  elif not any(urlparse(href).hostname and (
                      urlparse(href).hostname.endswith('.gov') or
                      urlparse(href).hostname == 'sfassessor.org' or
                      urlparse(href).hostname.endswith('.sfassessor.org') or
                      urlparse(href).hostname.endswith('.calwater.com') or
                      urlparse(href).hostname.endswith('.sjwater.com'))
                      for href in source_links):
                      errors.append(f'{page}: table row {row_num} has no recognized government/official utility source')
              for href in parser.hrefs:
                  if href.startswith(('https://', 'http://', 'mailto:', 'tel:')):
                      continue
                  path_part, _, fragment = href.partition('#')
                  target = (page.parent / path_part).resolve() if path_part else page.resolve()
                  if path_part and not target.exists():
                      errors.append(f'{page}: missing internal target {href}')
                      continue
                  if fragment and target.suffix == '.html' and target.exists():
                      target_parser = SiteParser()
                      target_parser.feed(target.read_text(encoding='utf-8'))
                      ids = set()
                      class IdParser(HTMLParser):
                          def handle_starttag(self, tag, attrs):
                              value = dict(attrs).get('id')
                              if value:
                                  ids.add(value)
                      id_parser = IdParser()
                      id_parser.feed(target.read_text(encoding='utf-8'))
                      if fragment not in ids:
                          errors.append(f'{page}: missing internal anchor {href}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'Validated {len(pages)} pages, their internal links, and table-row source links.')
          PY
      - name: Prepare public-site artifact
        run: |
          mkdir -p _site
          cp index.html styles.css _site/
          cp -R pages _site/pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
