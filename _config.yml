title: Estate decision desk
plugins: []
# Publication boundary: scripts/verify_safe.py PUBLISHED_DESKS is the allowlist alongside
# public-safe/. The only detailed live desk is cbe/; phase-99220/ is its stress-test and
# what-if supplement. Superseded desk generations are deliberately not served, to avoid
# competing numbers and previously flagged location identifiers on Pages.
# Excluding a path hides it from the built site only. It does not remove files from Git,
# existing clones, or repository history; this is not a history scrub.
exclude:
  - "_src"
  # a desk's generator is working material, not a page: it names the index series and the
  # owner-supplied inputs. Jekyll already skips every _-prefixed directory; this states it.
  - "desk-d75/_src"
  - "desk-d75/_src/**"
  - "decision/_src"
  - "decision/_src/**"
  - "cbe/_src"
  - "cbe/_src/**"
  # desk-31cb5781 (session arena-31cb5781, 2026-11-14): generator/verifier are working material, not pages.
  - "desk-31cb5781/_src"
  - "desk-31cb5781/_src/**"
