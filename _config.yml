title: Estate decision desk
plugins: []
# Publication boundary: scripts/verify_safe.py PUBLISHED_DESKS records the directories
# approved for Pages alongside public-safe/ (owner brief, 7b/INT: clear numbers and
# projections rounded to $10 must be reported in the decision analysis). Everything
# excluded below is working material or a desk with a known correction pending.
# Excluding a path hides it from the built site; it does not remove it from the
# repository, so anything that must not be public has to be deleted, not merely excluded.
exclude:
  - "_src"
  # a desk's generator is working material, not a page: it names the index series and the
  # owner-supplied inputs. Jekyll already skips every _-prefixed directory; this states it.
  - "desk-d75/_src"
  - "desk-d75/_src/**"
  - "decision/_src"
  - "decision/_src/**"
  - "cbe/_src"
  - "cbe/_src/**"
  # desk-31cb5781 (session arena-31cb5781, 2026-11-14): generator/verifier are working material, not pages.
  - "desk-31cb5781/_src"
  - "desk-31cb5781/_src/**"
  # decision-d2664fd0 (session arena-d2664fd0): consolidated decision desk; generator/verifier are working material.
  - "decision-d2664fd0/_src"
  - "decision-d2664fd0/_src/**"
  - "phase-99220/_src"
  - "phase-99220/_src/**"
  - "cbd/_src"
  - "cbd/_src/**"
  # inheritance desk: generator and model are working material; owner input data is not published
  - "inheritance-desk/_src"
  - "inheritance-desk/_src/**"
  - "inheritance-desk/data"
  - "inheritance-desk/data/**"
  - "COORDINATION.md"
  - "README.md"
